description: >-
  The Western Union Company is a global leader in cross-border, cross-currency money movement, providing money transfer,
  money order, and other financial services to consumers and businesses worldwide. Western Union's Partnership APIs
  enable financial institutions, fintech companies, and enterprise customers to integrate WU's global payment network
  for money transfers, batch payments, FX quotes, and account management across 200+ countries and territories in 130+
  currencies. Authentication uses mTLS with client certificates.
apis:
- aid: western-union:open-banking
  name: Western Union Open Banking API
  description: >-
    Western Union's PSD2-compliant Open Banking API enables Payment Service Providers to access account
    information (AIS) and initiate payments (PIS) in compliance with European Payment Services Directive
    2 (PSD2). The API supports Strong Customer Authentication (SCA) and integrates with the WU Business
    Solutions global payment network.
  humanURL: https://wu-priora.saltedge.com/
  baseURL: https://wu-priora.saltedge.com
