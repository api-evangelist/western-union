naftiko: "1.0.0-alpha1"

info:
  label: "Western Union Mass Payments"
  description: >-
    Western Union Mass Payments API for sending international batch payments
    across 130+ currencies in 200+ countries. Supports payment lifecycle
    management including batch creation, payment addition, FX quotes, and
    status tracking. Authentication uses mTLS client certificates.
  tags:
    - Money Transfer
    - Payments
    - International
    - Batch Payments
    - Financial Services
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      WU_CLIENT_ID: WU_CLIENT_ID
      WU_CERTIFICATE_PATH: WU_CERTIFICATE_PATH
      WU_CERTIFICATE_PASSWORD: WU_CERTIFICATE_PASSWORD

capability:
  consumes:
    - type: http
      namespace: wu-mass-payments
      baseUri: https://api.westernunion.com
      description: Western Union Mass Payments API for international batch payments.
      authentication:
        type: certificate
        certPath: "{{WU_CERTIFICATE_PATH}}"
        certPassword: "{{WU_CERTIFICATE_PASSWORD}}"
      resources:
        - name: health
          path: /Ping
          description: API health check.
          operations:
            - name: ping
              method: GET
              description: Check API availability and mTLS credentials.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: customer
          path: /customers/{clientId}
          description: Customer account details.
          operations:
            - name: get-customer
              method: GET
              description: Get partner customer account details.
              inputParameters:
                - name: clientId
                  in: path
                  type: string
                  required: true
                  description: Western Union client ID.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: holding-balance
          path: /HoldingBalance/{clientId}/{currencyCode}
          description: Currency holding balance.
          operations:
            - name: get-holding-balance
              method: GET
              description: Get holding balance for a specific currency.
              inputParameters:
                - name: clientId
                  in: path
                  type: string
                  required: true
                  description: Western Union client ID.
                - name: currencyCode
                  in: path
                  type: string
                  required: true
                  description: ISO 4217 currency code.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: batch
          path: /customers/{clientId}/batches/{batchId}
          description: Payment batch management.
          operations:
            - name: get-batch
              method: GET
              description: Get batch details and status.
              inputParameters:
                - name: clientId
                  in: path
                  type: string
                  required: true
                  description: Western Union client ID.
                - name: batchId
                  in: path
                  type: string
                  required: true
                  description: Batch identifier.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-batch
              method: PUT
              description: Create a new payment batch.
              inputParameters:
                - name: clientId
                  in: path
                  type: string
                  required: true
                  description: Western Union client ID.
                - name: batchId
                  in: path
                  type: string
                  required: true
                  description: Partner-assigned batch ID.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  reference: "{{tools.reference}}"

            - name: delete-batch
              method: DELETE
              description: Delete an uncommitted batch.
              inputParameters:
                - name: clientId
                  in: path
                  type: string
                  required: true
                  description: Western Union client ID.
                - name: batchId
                  in: path
                  type: string
                  required: true
                  description: Batch identifier.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: payments
          path: /customers/{clientId}/batches/{batchId}/payments
          description: Payments within a batch.
          operations:
            - name: list-payments
              method: GET
              description: List all payments in a batch.
              inputParameters:
                - name: clientId
                  in: path
                  type: string
                  required: true
                  description: Western Union client ID.
                - name: batchId
                  in: path
                  type: string
                  required: true
                  description: Batch identifier.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-payment
              method: POST
              description: Add a payment to an existing batch.
              inputParameters:
                - name: clientId
                  in: path
                  type: string
                  required: true
                  description: Western Union client ID.
                - name: batchId
                  in: path
                  type: string
                  required: true
                  description: Batch identifier.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  partnerReference: "{{tools.partnerReference}}"
                  amount: "{{tools.amount}}"
                  currencyCode: "{{tools.currencyCode}}"
                  beneficiary: "{{tools.beneficiary}}"
                  bankAccount: "{{tools.bankAccount}}"

        - name: quotes
          path: /customers/{clientId}/quotes
          description: FX rate quotes.
          operations:
            - name: create-quote
              method: POST
              description: Generate an FX rate quote for currency conversion.
              inputParameters:
                - name: clientId
                  in: path
                  type: string
                  required: true
                  description: Western Union client ID.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  tradeCurrency: "{{tools.tradeCurrency}}"
                  settlementCurrency: "{{tools.settlementCurrency}}"
                  tradeAmount: "{{tools.tradeAmount}}"

  exposes:
    - type: rest
      port: 8101
      namespace: wu-mass-payments-rest
      resources:
        - path: /v1/batches/{batchId}
          name: batch
          description: Create, get, or delete a payment batch.
          operations:
            - method: GET
              name: get-batch
              description: Get batch details.
              call: "wu-mass-payments.get-batch"
              with:
                clientId: "env.WU_CLIENT_ID"
                batchId: "rest.batchId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: PUT
              name: create-batch
              description: Create a new batch.
              call: "wu-mass-payments.create-batch"
              with:
                clientId: "env.WU_CLIENT_ID"
                batchId: "rest.batchId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: DELETE
              name: delete-batch
              description: Delete a batch.
              call: "wu-mass-payments.delete-batch"
              with:
                clientId: "env.WU_CLIENT_ID"
                batchId: "rest.batchId"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/batches/{batchId}/payments
          name: payments
          description: List and add payments to a batch.
          operations:
            - method: GET
              name: list-payments
              description: List all payments in a batch.
              call: "wu-mass-payments.list-payments"
              with:
                clientId: "env.WU_CLIENT_ID"
                batchId: "rest.batchId"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: POST
              name: create-payment
              description: Add a payment to a batch.
              call: "wu-mass-payments.create-payment"
              with:
                clientId: "env.WU_CLIENT_ID"
                batchId: "rest.batchId"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/quotes
          name: quotes
          description: Generate FX rate quotes.
          operations:
            - method: POST
              name: create-quote
              description: Get an FX rate quote.
              call: "wu-mass-payments.create-quote"
              with:
                clientId: "env.WU_CLIENT_ID"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: wu-mass-payments-mcp
      transport: http
      tools:
        - name: get-batch
          description: Get details and status of a Western Union payment batch.
          hints:
            readOnly: true
            openWorld: true
          call: "wu-mass-payments.get-batch"
          with:
            clientId: "env.WU_CLIENT_ID"
            batchId: "tools.batchId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-batch
          description: Create a new international payment batch.
          hints:
            readOnly: false
            destructive: false
            idempotent: true
          call: "wu-mass-payments.create-batch"
          with:
            clientId: "env.WU_CLIENT_ID"
            batchId: "tools.batchId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: list-payments
          description: List all payments in a batch.
          hints:
            readOnly: true
            openWorld: true
          call: "wu-mass-payments.list-payments"
          with:
            clientId: "env.WU_CLIENT_ID"
            batchId: "tools.batchId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-payment
          description: Add an international payment to a batch.
          hints:
            readOnly: false
            destructive: false
            idempotent: false
          call: "wu-mass-payments.create-payment"
          with:
            clientId: "env.WU_CLIENT_ID"
            batchId: "tools.batchId"
          outputParameters:
            - type: object
              mapping: "$."

        - name: create-quote
          description: Generate a foreign exchange rate quote for currency conversion.
          hints:
            readOnly: true
            openWorld: false
          call: "wu-mass-payments.create-quote"
          with:
            clientId: "env.WU_CLIENT_ID"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-holding-balance
          description: Check holding balance for a specific currency in the WU account.
          hints:
            readOnly: true
            openWorld: true
          call: "wu-mass-payments.get-holding-balance"
          with:
            clientId: "env.WU_CLIENT_ID"
            currencyCode: "tools.currencyCode"
          outputParameters:
            - type: object
              mapping: "$."
