description: FinOps shape for Western Union is partner-contract-driven - per-payment fees plus FX margin by corridor, no public price list, settled through the partner agreement.
sources:
  - https://www.westernunion.com/us/en/business/payments-api.html
notes: No public per-call or per-corridor price list. Meters reflect the actual billable shape (payments and FX-converted volume) but unit prices live in the partner contract.
billingModel:
  pricingCategory: Per-Transaction Fee + FX Margin
  billingFrequency: Per-Invoice
  billingCurrency: USD (settlement varies)
  chargeCategories:
    - Usage
    - Adjustment
    - Refund
focusColumns:
  ServiceName: Western Union Partner APIs
  ServiceCategory: Payments
  ProviderName: Western Union
  PublisherName: The Western Union Company
  InvoiceIssuerName: The Western Union Company
  BillingCurrency: USD
meters:
  - name: payments_initiated
    unit: transaction
    aggregation: sum
    dimensions:
      - send_country
      - receive_country
      - send_currency
      - receive_currency
      - payout_method
  - name: fx_converted_volume
    unit: send_currency_amount
    aggregation: sum
    dimensions:
      - send_currency
      - receive_currency
      - corridor
  - name: batches_submitted
    unit: batch
    aggregation: count
    dimensions:
      - partner
principles:
  - name: Visibility
    description: Reconcile against the Mass Payments batch responses and partner settlement reports; there is no public billing API.
  - name: Allocation
    description: Allocate by corridor (send/receive country pair) and partner account, since fees and FX margins differ per corridor.
  - name: Optimization
    description: Optimization levers are corridor selection, payout method (bank vs cash vs wallet), batching, and renegotiating partner FX margins.
  - name: Accountability
    description: Treasury / payment-ops owns FX and corridor mix; engineering owns batch reliability and reconciliation accuracy.
