description: Western Union's API rate limits are not publicly documented. Limits, burst behavior, and headers are configured per partner integration in the Mass Payments / Open Banking onboarding kit. Documented batch limits exist for Mass Payments (e.g., 10,000 payments per batch) but no public per-second / per-minute throttle is published.
sources:
  - https://www.westernunion.com/us/en/business/payments-api.html
notes: developer.westernunion.com unreachable; rate-limit numbers are not public. Mass Payments documents a 10,000 payments-per-batch ceiling per partner brief; treat as a batch-shape limit, not a request-rate.
responseCodes:
  throttled: 429
limits:
  - name: Mass Payments Batch Size
    scope: account
    metric: payments_per_batch
    limit: 10000
    notes: Per partner-published Mass Payments brief - up to 10,000 international payments per submitted batch. Not a request-rate limit.
  - name: Per-Partner Request Rate
    scope: contract
    metric: varies
    limit: see partner agreement
    notes: Per-second / per-minute thresholds are agreed per partner; not publicly documented.
policies:
  - name: mTLS-Scoped Throttling
    description: Limits attach to the mTLS client certificate / partner identity issued during onboarding; rotate or replace certs through partner support.
  - name: Backoff
    description: Use exponential backoff with jitter on 429 / 503; honor Retry-After when present.
maintainers: []
